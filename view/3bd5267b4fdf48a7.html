<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ZCV OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080a0f'/%3E%3Cpath d='M18 44L32 16l14 28' stroke='%238ab4ff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M24 36h16' stroke='%238ab4ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* zcv — desktop shell */
:root {
  --bg: #080a0f;
  --panel: #11141c;
  --panel2: #181c27;
  --line: #2a3142;
  --text: #edf0f7;
  --muted: #8a93a8;
  --accent: #8ab4ff;
  --accent2: #6e8ef5;
  --danger: #ff6b6b;
  --ok: #3dd68c;
  --dock: rgba(12,14,20,.82);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --shadow: 0 18px 50px rgba(0,0,0,.55);
  --wall: #080a0f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: var(--font); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #333a4a; border-radius: 3px; }

/* ---------- boot ---------- */
#boot {
  position: fixed; inset: 0; z-index: 10000;
  background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .7s ease, visibility .7s;
}
#boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-mark {
  width: 72px; height: 72px;
  margin-bottom: 22px;
  opacity: 0;
  transform: scale(.6);
  animation: bootIn .7s .15s cubic-bezier(.2,.8,.2,1) forwards;
}
.boot-mark svg { width: 100%; height: 100%; filter: drop-shadow(0 0 18px rgba(138,180,255,.35)); }
.boot-name {
  font-size: 13px; letter-spacing: .35em; text-transform: uppercase;
  color: #5a6478; opacity: 0; animation: fadeUp .5s .45s forwards;
}
.boot-track {
  width: 160px; height: 2px; margin-top: 28px;
  background: #1a1e28; border-radius: 1px; overflow: hidden;
  opacity: 0; animation: fadeUp .4s .55s forwards;
}
.boot-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5a8fff, #8ab4ff, #c4d7ff);
  box-shadow: 0 0 12px rgba(138,180,255,.5);
  transition: width .2s linear;
}
.boot-msg {
  margin-top: 14px; font-size: 11px; color: #3d4558;
  height: 14px; letter-spacing: .04em;
  opacity: 0; animation: fadeUp .4s .65s forwards;
}
@keyframes bootIn { to { opacity: 1; transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* grain overlay */
.grain {
  pointer-events: none; position: fixed; inset: 0; z-index: 9000;
  opacity: .04; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- desktop ---------- */
#desk {
  display: none; height: 100%; position: relative;
  background: var(--wall);
}
#desk.on { display: block; }

/* subtle vignette */
#desk::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 100%);
}

.bar {
  position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 50;
  display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: rgba(10,12,18,.78);
  backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.bar-logo {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  color: var(--accent);
}
.bar-logo svg { width: 16px; height: 16px; }
.start {
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; color: var(--muted);
  border: 1px solid transparent;
}
.start:hover { color: var(--text); background: rgba(255,255,255,.05); border-color: var(--line); }
.search-wrap { position: relative; flex: 1; max-width: 240px; }
.search-wrap input {
  width: 100%; padding: 4px 10px 4px 28px;
  border-radius: 7px; border: 1px solid rgba(255,255,255,.07);
  background: rgba(0,0,0,.25); color: var(--text); font-size: 12px; outline: none;
}
.search-wrap input:focus { border-color: rgba(138,180,255,.35); }
.search-wrap svg {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: var(--muted); pointer-events: none;
}
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.clock { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px; }
.ib {
  width: 26px; height: 26px; border-radius: 6px;
  display: grid; place-items: center; color: var(--muted);
}
.ib:hover { background: rgba(255,255,255,.06); color: var(--text); }
.ib svg { width: 14px; height: 14px; }

/* start menu */
.menu {
  position: absolute; top: 38px; left: 8px; width: 260px; z-index: 70;
  background: rgba(17,20,28,.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: none; overflow: hidden;
}
.menu.open { display: block; animation: pop .18s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.menu-h {
  padding: 11px 14px 8px;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.mi {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 8px 14px; text-align: left; font-size: 13px; color: var(--text);
}
.mi:hover { background: rgba(138,180,255,.08); }
.mi .ic {
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--panel2); border: 1px solid var(--line);
}
.mi .ic svg { width: 16px; height: 16px; }

/* desktop icons */
.icons {
  position: absolute; top: 48px; left: 12px; z-index: 5;
  display: flex; flex-direction: column; gap: 10px;
  max-height: calc(100% - 110px); overflow-y: auto;
}
.di {
  width: 70px; padding: 6px 4px; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--text);
}
.di:hover { background: rgba(255,255,255,.06); }
.di .ic {
  width: 44px; height: 44px; border-radius: 11px;
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
}
.di .ic svg { width: 22px; height: 22px; }
.di span {
  font-size: 10px; text-align: center; max-width: 66px;
  text-shadow: 0 1px 4px #000; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* dock */
.dock {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  z-index: 40; display: flex; gap: 4px; padding: 6px 8px;
  background: var(--dock);
  backdrop-filter: blur(22px) saturate(1.3);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  max-width: 96vw; overflow-x: auto;
}
.dk {
  width: 44px; height: 44px; border-radius: 11px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.04);
  border: 1px solid transparent;
  position: relative; flex-shrink: 0;
  transition: transform .18s cubic-bezier(.2,.9,.3,1.2), background .15s;
}
.dk:hover {
  transform: translateY(-5px) scale(1.06);
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.1);
}
.dk svg { width: 22px; height: 22px; }
.dk .tip {
  position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  font-size: 10px; padding: 3px 7px; border-radius: 5px; white-space: nowrap;
  background: #1a1e28; border: 1px solid var(--line); color: var(--text);
  opacity: 0; pointer-events: none; transition: .12s;
}
.dk:hover .tip { opacity: 1; }
.dsep { width: 1px; align-self: stretch; margin: 6px 3px; background: rgba(255,255,255,.08); }

/* windows */
.win {
  position: absolute; display: none; flex-direction: column;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 11px;
  box-shadow: var(--shadow);
  overflow: hidden; z-index: 20;
  min-width: 260px; min-height: 160px;
}
.win.open { display: flex; animation: winIn .2s ease; }
@keyframes winIn { from { opacity: 0; transform: scale(.97) translateY(8px); } }
.wbar {
  height: 34px; flex-shrink: 0;
  display: flex; align-items: center; gap: 5px; padding: 0 10px;
  background: rgba(0,0,0,.2);
  border-bottom: 1px solid rgba(255,255,255,.05);
  cursor: grab; user-select: none;
}
.wbar:active { cursor: grabbing; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.r { background: #ff5f57; }
.dot.y { background: #febc2e; }
.dot.g { background: #28c840; }
.wtitle {
  flex: 1; text-align: center; font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: .02em;
}
.wbody { flex: 1; overflow: hidden; position: relative; background: var(--bg); }
.wbody iframe { width: 100%; height: 100%; border: 0; background: #000; }
.pad { height: 100%; overflow-y: auto; padding: 16px 18px; }

/* store */
.hero {
  border-radius: 12px; padding: 20px 18px; margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,.07);
  background:
    radial-gradient(ellipse at 90% 20%, rgba(138,180,255,.12), transparent 50%),
    linear-gradient(145deg, #12151e, #0e1018);
}
.hero h2 { font-size: 18px; font-weight: 750; margin-bottom: 4px; }
.hero p { font-size: 12px; color: var(--muted); line-height: 1.45; max-width: 42ch; }
.lab {
  font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 14px 0 8px;
}
.row {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; margin-bottom: 6px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.02);
  transition: border-color .15s;
}
.row:hover { border-color: rgba(138,180,255,.3); }
.row .ic {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.08);
}
.row .ic svg { width: 20px; height: 20px; }
.row .info { flex: 1; min-width: 0; }
.row .nm { font-size: 13px; font-weight: 650; }
.row .ds { font-size: 11px; color: var(--muted); margin-top: 1px; }
.btn {
  padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 650;
  transition: .12s; white-space: nowrap;
}
.btn.p { background: var(--accent); color: #0a0c12; }
.btn.p:hover { filter: brightness(1.08); }
.btn.g { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn.g:hover { border-color: var(--accent); color: var(--accent); }

/* games */
.gsearch {
  width: 100%; padding: 8px 12px; margin-bottom: 10px;
  border-radius: 9px; border: 1px solid rgba(255,255,255,.07);
  background: rgba(0,0,0,.2); color: var(--text); font-size: 12px; outline: none;
}
.gsearch:focus { border-color: rgba(138,180,255,.35); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.chip {
  padding: 4px 10px; border-radius: 14px; font-size: 11px; font-weight: 600;
  border: 1px solid rgba(255,255,255,.08); color: var(--muted); background: transparent;
}
.chip.on, .chip:hover { background: var(--accent); color: #0a0c12; border-color: var(--accent); }
.gg {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px;
}
.gc {
  border-radius: 10px; overflow: hidden; cursor: pointer;
  border: 1px solid rgba(255,255,255,.06);
  background: var(--panel);
  transition: transform .18s, border-color .15s, box-shadow .18s;
}
.gc:hover {
  transform: translateY(-3px);
  border-color: rgba(138,180,255,.35);
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.gc .em {
  height: 64px; display: grid; place-items: center;
  background: linear-gradient(160deg, #151922, #0e1118);
  font-size: 26px;
}
.gc .nm { padding: 6px 6px 2px; font-size: 11px; font-weight: 650; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc .ct { padding: 0 6px 8px; font-size: 10px; color: var(--muted); text-align: center; }

/* calc */
.calc { max-width: 260px; margin: 0 auto; padding: 12px; }
.cd {
  padding: 14px; margin-bottom: 10px; text-align: right;
  font-size: 26px; font-variant-numeric: tabular-nums;
  border-radius: 9px; border: 1px solid rgba(255,255,255,.07);
  background: rgba(0,0,0,.25); min-height: 48px; word-break: break-all;
}
.ck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ck button {
  padding: 12px; border-radius: 9px; font-size: 15px; font-weight: 600;
  background: var(--panel2); border: 1px solid rgba(255,255,255,.06); color: var(--text);
}
.ck button:hover { border-color: rgba(138,180,255,.3); }
.ck .op { color: var(--accent); }
.ck .eq { background: var(--accent); color: #0a0c12; border-color: var(--accent); }
.ck .s2 { grid-column: span 2; }

/* notes */
.note {
  width: 100%; height: 100%; min-height: 280px; padding: 14px 16px;
  background: transparent; border: none; resize: none; outline: none;
  font-size: 13px; line-height: 1.55; color: var(--text);
}

/* browser chrome */
.bbar {
  display: flex; gap: 5px; padding: 6px 8px;
  background: rgba(0,0,0,.25); border-bottom: 1px solid rgba(255,255,255,.05);
}
.bbar input {
  flex: 1; padding: 5px 10px; border-radius: 7px;
  border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.3);
  color: var(--text); font-size: 12px; outline: none;
}
.bbar input:focus { border-color: rgba(138,180,255,.35); }
.bbar button {
  padding: 5px 10px; border-radius: 7px; font-size: 11px;
  border: 1px solid rgba(255,255,255,.08); color: var(--muted);
}
.bbar button:hover { color: var(--text); border-color: var(--line); }
.bframe { width: 100%; height: calc(100% - 38px); border: 0; background: #fff; }

/* terminal */
.term {
  height: 100%; overflow-y: auto; padding: 12px 14px;
  background: #06080c; color: #9fd6b0;
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
}
.term .pr { color: var(--accent); }
.term-in { display: flex; gap: 6px; margin-top: 2px; }
.term-in input {
  flex: 1; background: transparent; border: none; outline: none;
  color: #9fd6b0; font: inherit;
}

/* settings */
.srow {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.05);
}
.sl { font-size: 13px; font-weight: 550; }
.sd { font-size: 11px; color: var(--muted); margin-top: 1px; }
.sw { display: flex; gap: 5px; flex-wrap: wrap; }
.swatch {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
}
.swatch.on { border-color: #fff; box-shadow: 0 0 0 1px #000; }
.wo {
  width: 32px; height: 22px; border-radius: 5px;
  border: 2px solid transparent; cursor: pointer;
  background-size: cover; background-position: center;
}
.wo.on { border-color: #fff; }

.toast {
  position: fixed; bottom: 68px; left: 50%; z-index: 200;
  transform: translateX(-50%) translateY(20px);
  padding: 8px 14px; border-radius: 8px; font-size: 12px;
  background: #1a1e28; border: 1px solid var(--line);
  opacity: 0; transition: .22s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.cloak {
  position: absolute; top: 36px; right: 6px; z-index: 80;
  background: #151922; border: 1px solid var(--line);
  border-radius: 9px; padding: 5px; min-width: 150px; display: none;
}
.cloak.open { display: block; }
.ci { padding: 7px 11px; border-radius: 5px; font-size: 12px; cursor: pointer; }
.ci:hover { background: rgba(138,180,255,.1); color: var(--accent); }

@media (max-width: 640px) {
  .icons { left: 6px; top: 42px; }
  .dock { bottom: 6px; }
  .dk { width: 40px; height: 40px; }
  .search-wrap { display: none; }
}

/* real-app icon polish */
.di .ic, .mi .ic, .row .ic {
  padding: 0 !important;
  overflow: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: 0 6px 16px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.08) inset !important;
}
.di .ic svg, .mi .ic svg, .row .ic svg, .dk svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}
.dk {
  padding: 0 !important;
  overflow: hidden;
  background: transparent !important;
  border: none !important;
  box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
.dk:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,.45);
}
.row {
  padding: 12px 14px !important;
  gap: 14px !important;
}
.row .ic {
  width: 52px !important;
  height: 52px !important;
  border-radius: 12px !important;
}
.row .nm { font-size: 14px !important; font-weight: 650 !important; }
.row .ds { font-size: 11px !important; margin-top: 3px !important; }
.row .meta {
  display: flex; gap: 8px; align-items: center; margin-top: 4px;
  font-size: 10px; color: var(--muted);
}
.row .stars { color: #fbbf24; letter-spacing: 1px; }
.di .ic {
  width: 48px !important;
  height: 48px !important;
  border-radius: 12px !important;
}
.di span { font-size: 11px !important; margin-top: 2px; }
.dk { width: 48px !important; height: 48px !important; border-radius: 12px !important; }
.mi .ic {
  width: 34px !important; height: 34px !important; border-radius: 9px !important;
}


.di .ic img, .mi .ic img, .row .ic img, .dk img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  border-radius: inherit;
}

</style>
</head>
<body>
<div class="grain"></div>

<div id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#0c1018"/>
      <path d="M18 44L32 16l14 28" stroke="#8ab4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 36h16" stroke="#8ab4ff" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="boot-name">ZCV OS</div>
  <div class="boot-track"><div class="boot-fill" id="bf"></div></div>
  <div class="boot-msg" id="bm">…</div>
</div>

<div id="desk">
  <div class="bar">
    <button class="start" id="startBtn">Menu</button>
    <div class="bar-logo">
      <svg viewBox="0 0 64 64" fill="none"><path d="M18 44L32 16l14 28" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 36h16" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      ZCV
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Search…" autocomplete="off">
    </div>
    <div class="bar-right">
      <span class="clock" id="clk">00:00</span>
      <button class="ib" id="cloakBtn" title="Cloak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="cloak" id="cloakMenu">
        <div class="ci" data-c="classroom">Classroom</div>
        <div class="ci" data-c="docs">Google Docs</div>
        <div class="ci" data-c="drive">Drive</div>
        <div class="ci" data-c="khan">Khan Academy</div>
        <div class="ci" data-c="reset">Reset</div>
      </div>
    </div>
  </div>

  <div class="menu" id="menu">
    <div class="menu-h">Apps</div>
    <div id="menuItems"></div>
  </div>

  <div class="icons" id="icons"></div>

/* boot */
(function(){
  const msgs = ['checking modules','loading shell','mounting apps','starting compositor','welcome'];
  const bf = document.getElementById('bf'), bm = document.getElementById('bm');
  let i = 0;
  function tick(){
    if(i < msgs.length){
      bm.textContent = msgs[i];
      bf.style.width = ((i+1)/msgs.length*100)+'%';
      i++;
      setTimeout(tick, 200 + Math.random()*160);
    } else {
      setTimeout(()=>{
        document.getElementById('boot').classList.add('gone');
        document.getElementById('desk').classList.add('on');
        start();
      }, 320);
    }
  }
  setTimeout(tick, 400);
})();

function start(){
  tickClock();
  setInterval(tickClock, 20000);
  buildUI();
  buildStore();
    buildCalc();
  wireWins();
  wireMenu();
  wireSearch();
          wireCloak();
  
  // default wall
  applyWall('dusk');
}

function tickClock(){
  document.getElementById('clk').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function buildUI(){
  document.getElementById('icons').innerHTML = APPS.filter(a=>a.desk).map(a=>`
    <button class="di" data-a="${a.id}">
      <div class="ic">${ICO[a.id]}</div>
      <span>${a.name}</span>
    </button>`).join('');
  const d = document.getElementById('dock');
  let html = '';
  APPS.filter(a=>a.dock).forEach((a,i)=>{
    if(i===3) html += '<div class="dsep"></div>';
    html += `<button class="dk" data-a="${a.id}">${ICO[a.id]}<span class="tip">${a.name}</span></button>`;
  });
  d.innerHTML = html;
  document.getElementById('menuItems').innerHTML = APPS.map(a=>`
    <button class="mi" data-a="${a.id}"><span class="ic">${ICO[a.id]}</span>${a.name}</button>
  `).join('');
  document.querySelectorAll('[data-a]').forEach(el=>{
    el.addEventListener('click', ()=> openApp(el.dataset.a));
  });
}


function buildStore(){
  const meta = {
    store:   { ver:'2.1', stars:'★★★★★', size:'Built-in',  blurb:'Browse and open every app on this desktop.' },
    twitter: { ver:'1.0', stars:'★★★★☆', size:'Local',     blurb:'X-style timeline, compose, and profiles.' },
    gsn:     { ver:'1.4', stars:'★★★★★', size:'Local',     blurb:'Orbit, PS5, Xbox & Fusion console hubs.' },
    fyn:     { ver:'—',   stars:'★★★★☆', size:'Web',       blurb:'Fyn OS desktop environment online.' },
    opium:   { ver:'1.0', stars:'★★★★★', size:'Local',     blurb:'Singlefile portal · loads remote modules.' },
    calc:    { ver:'1.0', stars:'★★★★☆', size:'Built-in',  blurb:'Quick arithmetic with a clean keypad.' }
  };
  document.getElementById('storePad').innerHTML = `
    <div class="hero">
      <h2>App Store</h2>
      <p>Apps installed on ZCV OS. Open any of them in a window from here, the dock, or the desktop.</p>
    </div>
    <div class="lab">Installed · ${APPS.length}</div>
    ${APPS.map(a=>{
      const m = meta[a.id] || { ver:'1.0', stars:'★★★★☆', size:'App', blurb:a.file||a.url||'built-in' };
      return `
      <div class="row">
        <div class="ic">${ICO[a.id]}</div>
        <div class="info">
          <div class="nm">${a.name}</div>
          <div class="ds">${m.blurb}</div>
          <div class="meta"><span class="stars">${m.stars}</span><span>v${m.ver}</span><span>${m.size}</span></div>
        </div>
        <button class="btn p" onclick="openApp('${a.id}')">Open</button>
      </div>`;
    }).join('')}`;
}


function buildGames(){
  const cats = ['All',...new Set(GAMES.map(g=>g.cat))];
  document.getElementById('chips').innerHTML = cats.map(c=>
    `<button class="chip ${c==='All'?'on':''}" data-c="${c}">${c}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(c=>{
    c.onclick = ()=>{
      document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); cat = c.dataset.c; paintGames();
    };
  });
  document.getElementById('gs').oninput = paintGames;
  paintGames();
}

function paintGames(){
  const q = (document.getElementById('gs').value||'').toLowerCase();
  let list = GAMES;
  if(cat!=='All') list = list.filter(g=>g.cat===cat);
  if(q) list = list.filter(g=>g.name.toLowerCase().includes(q));
  document.getElementById('gg').innerHTML = list.map(g=>`
    <div class="gc" onclick="play('${g.id}')">
      <div class="em">${g.e}</div>
      <div class="nm">${g.name}</div>
      <div class="ct">${g.cat}</div>
    </div>`).join('') || '<p style="color:var(--muted)">Nothing matched.</p>';
}

function play(id){
  const g = GAMES.find(x=>x.id===id); if(!g) return;
  document.getElementById('pt').textContent = g.name;
  document.getElementById('f-player').src = g.url;
  openApp('player');
}

function buildCalc(){
  const keys = ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  document.getElementById('ck').innerHTML = keys.map(k=>{
    const cls = '÷×−+'.includes(k)?'op':k==='='?'eq':k==='0'?'s2':'';
    return `<button class="${cls}" data-k="${k}">${k}</button>`;
  }).join('');
  document.querySelectorAll('#ck button').forEach(b=>b.onclick=()=>ckey(b.dataset.k));
}

function ckey(k){
  const d = document.getElementById('cd');
  if(k==='C'){ expr=''; d.textContent='0'; return; }
  if(k==='='){
    try{
      const e = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      const r = Function('"use strict";return('+e+')')();
      d.textContent = String(r); expr = String(r);
    }catch{ d.textContent='Error'; expr=''; }
    return;
  }
  if(k==='±'){ expr = expr.startsWith('-')?expr.slice(1):('-'+expr); d.textContent=expr||'0'; return; }
  if(k==='%'){ try{ expr=String(parseFloat(expr)/100); d.textContent=expr; }catch{} return; }
  expr += k; d.textContent = expr;
}

function openApp(id){
  const w = document.getElementById('win-'+id);
  if(!w) return;
  w.classList.add('open');
  w.style.zIndex = ++z;
  document.getElementById('menu').classList.remove('open');
  if(id==='twitter'){
    const f=document.getElementById('f-twitter');
    if(!f.src.includes('twitter')) f.src='twitter.html';
  }
  if(id==='gsn'){
    const f=document.getElementById('f-gsn');
    if(!f.src.includes('gsn')) f.src='gsn.html';
  }
  if(id==='fyn'){
    const f=document.getElementById('f-fyn');
    if(!f.src.includes('evilubg')) f.src='https://evilubg.s3.amazonaws.com/index.html';
  }
  if(id==='opium'){
    const f=document.getElementById('f-opium');
    if(!f.src.includes('opium')) f.src='opium.html';
  }
  if(id==='browser'){
    const f=document.getElementById('bFrame');
    if(f.src==='about:blank') f.src='https://example.com';
  }
}

function closeApp(id){
  const w=document.getElementById('win-'+id);
  if(w) w.classList.remove('open');
  if(id==='twitter') document.getElementById('f-twitter').src='about:blank';
  if(id==='gsn') document.getElementById('f-gsn').src='about:blank';
  if(id==='player') document.getElementById('f-player').src='about:blank';
  if(id==='fyn') document.getElementById('f-fyn').src='about:blank';
  if(id==='opium') document.getElementById('f-opium').src='about:blank';
}

function wireWins(){
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>closeApp(b.dataset.x));
  document.querySelectorAll('.wbar').forEach(bar=>{
    const win = bar.parentElement;
    let ox,oy,drag=false;
    bar.onmousedown = e=>{
      if(e.target.classList.contains('dot')) return;
      drag=true; ox=e.clientX-win.offsetLeft; oy=e.clientY-win.offsetTop;
      win.style.zIndex=++z;
    };
    window.addEventListener('mousemove',e=>{
      if(!drag) return;
      win.style.left=Math.max(0,e.clientX-ox)+'px';
      win.style.top=Math.max(34,e.clientY-oy)+'px';
    });
    window.addEventListener('mouseup',()=>drag=false);
  });
  document.querySelectorAll('.win').forEach(w=>{
    w.addEventListener('mousedown',()=>{ w.style.zIndex=++z; });
  });
}

function wireMenu(){
  const m=document.getElementById('menu');
  document.getElementById('startBtn').onclick=e=>{ e.stopPropagation(); m.classList.toggle('open'); };
  document.addEventListener('click',()=>m.classList.remove('open'));
}

function wireSearch(){
  document.getElementById('q').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const v=e.target.value.toLowerCase().trim(); if(!v) return;
    const a=APPS.find(x=>x.name.toLowerCase().includes(v)||x.id.includes(v));
    if(a){ openApp(a.id); e.target.value=''; return; }
    toast('no match');
  });
}

function wireBrowser(){
  const go=()=>{
    let u=document.getElementById('bUrl').value.trim(); if(!u) return;
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    document.getElementById('bUrl').value=u;
    document.getElementById('bFrame').src=u;
  };
  document.getElementById('bGo').onclick=go;
  document.getElementById('bUrl').onkeydown=e=>{ if(e.key==='Enter') go(); };
  document.getElementById('bBack').onclick=()=>{ try{ document.getElementById('bFrame').contentWindow.history.back(); }catch{} };
}

function wireNotes(){
  document.getElementById('note').oninput=e=>localStorage.setItem('zcv_n', e.target.value);
}

function wireTerm(){
  const out=document.getElementById('term'), inp=document.getElementById('ti');
  function line(t){
    const d=document.createElement('div'); d.textContent=t;
    out.insertBefore(d, out.querySelector('.term-in'));
    out.scrollTop=out.scrollHeight;
  }
  inp.onkeydown=e=>{
    if(e.key!=='Enter') return;
    const raw=inp.value.trim(); inp.value='';
    line('$ '+raw); if(!raw) return;
    const [c,...a]=raw.split(/\s+/);
    if(c==='clear'){ out.querySelectorAll('div:not(.term-in)').forEach(x=>x.remove()); return; }
    if(c==='help'){ line('help clear apps games date echo open <app> neofetch'); return; }
    if(c==='apps'){ line(APPS.map(x=>x.id).join('  ')); return; }
    if(c==='games'){ line(GAMES.map(x=>x.name).join(', ')); return; }
    if(c==='date'){ line(new Date().toString()); return; }
    if(c==='echo'){ line(a.join(' ')); return; }
    if(c==='open'&&a[0]){ openApp(a[0]); line('opened '+a[0]); return; }
    if(c==='neofetch'){ line('ZCV OS  |  apps '+APPS.length+'  |  games '+GAMES.length); return; }
    line(c+': not found');
  };
}

function applyWall(id){
  const v = WALLS[id]||WALLS.dusk;
  document.getElementById('desk').style.background = v;
  document.querySelectorAll('#ww .wo').forEach(w=>w.classList.toggle('on', w.dataset.w===id));
}

function wireSettings(){
  const sw=document.getElementById('sw');
  Object.keys(THEMES).forEach((k,i)=>{
    const b=document.createElement('div');
    b.className='swatch'+(i===0?' on':'');
    b.style.background=THEMES[k].a;
    b.dataset.t=k;
    b.onclick=()=>{
      document.querySelectorAll('#sw .swatch').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const t=THEMES[k];
      document.documentElement.style.setProperty('--accent',t.a);
      document.documentElement.style.setProperty('--accent2',t.b);
    };
    sw.appendChild(b);
  });
  const ww=document.getElementById('ww');
  Object.keys(WALLS).forEach((k,i)=>{
    const b=document.createElement('div');
    b.className='wo'+(k==='dusk'?' on':'');
    b.dataset.w=k;
    b.style.background=WALLS[k];
    b.onclick=()=>applyWall(k);
    ww.appendChild(b);
  });
  document.getElementById('blankBtn').onclick=()=>{
    const w=window.open('about:blank','_blank');
    if(w){
      w.document.write('<!DOCTYPE html><html><head><title>Classes</title><link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png"></head><body style="margin:0"><iframe src="'+location.href+'" style="border:0;width:100%;height:100vh"></iframe></body></html>');
      w.document.close();
    }
  };
  document.getElementById('clrNote').onclick=()=>{
    localStorage.removeItem('zcv_n');
    document.getElementById('note').value='';
    toast('notes cleared');
  };
}

function wireCloak(){
  const m=document.getElementById('cloakMenu');
  document.getElementById('cloakBtn').onclick=e=>{ e.stopPropagation(); m.classList.toggle('open'); };
  document.addEventListener('click',()=>m.classList.remove('open'));
  const map={
    classroom:{t:'Classes',i:'https://ssl.gstatic.com/classroom/favicon.png'},
    docs:{t:'Untitled document - Google Docs',i:'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico'},
    drive:{t:'My Drive - Google Drive',i:'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png'},
    khan:{t:'Khan Academy',i:'https://cdn.kastatic.org/images/favicon.ico'},
    reset:{t:'ZCV OS',i:null}
  };
  document.querySelectorAll('.ci').forEach(c=>{
    c.onclick=()=>{
      const x=map[c.dataset.c]; if(!x) return;
      document.title=x.t;
      let l=document.querySelector("link[rel*='icon']")||document.createElement('link');
      l.rel='icon';
      l.href=x.i||document.querySelector("link[rel*='icon']").href;
      document.head.appendChild(l);
      m.classList.remove('open');
      toast('cloaked');
    };
  });
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600);
}

window.openApp=openApp;
window.play=play;
</script>
