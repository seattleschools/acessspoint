<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     style="font-family:Arial,Helvetica,sans-serif;">

  <!-- Try to embed the site -->
  <foreignObject width="100%" height="100%">
    <iframe src="https://education.palypro.com"
            width="100%" height="100%"
            frameborder="0"
            style="border:none;">
      <!-- If the iframe can’t load, the fallback text appears -->
      <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#f0f0f0;color:#555;">
        <a href="https://education.palypro.com" target="_blank"
           style="font-size:20px;color:#0066cc;text-decoration:none;">
          Open education.palypro.com in a new tab
        </a>
      </div>
    </iframe>
  </foreignObject>

  <!-- Optional overlay text for extra guidance -->
  <text x="50%" y="580"
        text-anchor="middle"
        fill="#666"
        font-size="14">
    If the page is blank, the site may block iframe embedding.
  </text>

</svg>