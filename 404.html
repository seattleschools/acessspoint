<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --link: #58a6ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      .box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 600;
        line-height: 1.25;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      .label {
        display: inline-block;
        margin-bottom: 16px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .contact {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="box">
        <div class="label">404</div>
        <h1>Page not found</h1>
        <p>
          The page you are looking for does not exist, may have been removed,
          or the link may be incorrect.
        </p>
        <div class="contact">
          <p>
            For takedown requests or related concerns, contact
            <a href="mailto:G.GUI@extreem.me">G.GUI@extreem.me</a>.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
